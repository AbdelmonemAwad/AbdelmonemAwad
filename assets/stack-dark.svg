<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Anatomy of an OPNsense plugin">
  <defs>
    <style>
      .t  { font-family: ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif; }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .hd { font-size: 20px; font-weight: 700; fill: #E6EDF3; }
      .lb { font-size: 19px; font-weight: 650; fill: #E6EDF3; }
      .sb { font-size: 13px; fill: #8B949E; }
      .cp { font-size: 11.5px; fill: #F97316; }
      .kk { font-size: 12px; fill: #6E7681; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect width="900" height="560" rx="14" fill="#0D1117"/>
  <rect x="40" y="34" width="3" height="20" rx="1.5" fill="#F97316"/>
  <text x="56" y="51" class="t hd">Anatomy of an OPNsense plugin</text>
  <text x="56" y="74" class="m kk">HOW I BUILD THEM</text>

  <g>
    <!-- layer 1 -->
    <rect x="40" y="100" width="820" height="66" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="64" y="128" class="t lb">Web GUI</text>
    <text x="64" y="150" class="t sb">Volt templates · PHP controllers · form definitions in XML · gettext-ready strings</text>
    <rect x="700" y="118" width="136" height="28" rx="6" fill="#0D1117" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="768" y="136" class="m cp" text-anchor="middle">Volt · PHP · CSS</text>

    <!-- layer 2 -->
    <rect x="40" y="192" width="820" height="66" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="64" y="220" class="t lb">MVC API</text>
    <text x="64" y="242" class="t sb">JSON endpoints, ACL entries, and the model that the GUI and the CLI both talk to</text>
    <rect x="700" y="210" width="136" height="28" rx="6" fill="#0D1117" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="768" y="228" class="m cp" text-anchor="middle">PHP · XML</text>

    <!-- layer 3 -->
    <rect x="40" y="284" width="820" height="66" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="64" y="312" class="t lb">configd</text>
    <text x="64" y="334" class="t sb">action definitions, config templates, and the scheduler that fires the jobs</text>
    <rect x="700" y="302" width="136" height="28" rx="6" fill="#0D1117" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="768" y="320" class="m cp" text-anchor="middle">conf · templates</text>

    <!-- layer 4 -->
    <rect x="40" y="376" width="820" height="66" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="64" y="404" class="t lb">Python backend</text>
    <text x="64" y="426" class="t sb">collectors, health watchdogs, report builders, mail delivery, panel rendering</text>
    <rect x="700" y="394" width="136" height="28" rx="6" fill="#0D1117" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="768" y="412" class="m cp" text-anchor="middle">Python 3</text>

    <!-- layer 5 -->
    <rect x="40" y="468" width="820" height="66" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="64" y="496" class="t lb">FreeBSD</text>
    <text x="64" y="518" class="t sb">ifconfig · SFF/DOM transceiver registers · LCDproc · SMTP</text>
    <rect x="700" y="486" width="136" height="28" rx="6" fill="#0D1117" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="768" y="504" class="m cp" text-anchor="middle">system layer</text>
  </g>

  <g fill="#F97316" opacity="0.85">
    <path d="M444 170 l8 14 h-16 z" transform="rotate(180 450 179)"/>
    <path d="M444 262 l8 14 h-16 z" transform="rotate(180 450 271)"/>
    <path d="M444 354 l8 14 h-16 z" transform="rotate(180 450 363)"/>
    <path d="M444 446 l8 14 h-16 z" transform="rotate(180 450 455)"/>
  </g>
</svg>
